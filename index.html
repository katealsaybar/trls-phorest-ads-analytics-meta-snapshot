<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tara Rose Salon — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia',serif;background:#F9E8DF;min-height:100vh;color:#5C5557}
header{background:#fff;border-bottom:0.5px solid #e8d5cc;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo-name{font-size:18px;letter-spacing:6px;text-transform:uppercase;color:#5C5557;font-weight:400}
.logo-sub{font-size:9px;letter-spacing:4px;color:#9a8a87;text-transform:uppercase;margin-top:2px}
.header-right{font-size:11px;color:#9a8a87;letter-spacing:1px}
main{max-width:1200px;margin:0 auto;padding:2rem}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:2rem;align-items:center}
.branch-pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:6px 16px;border-radius:20px;font-size:12px;border:0.5px solid #c0b0ad;cursor:pointer;background:#fff;color:#9a8a87;letter-spacing:1px;text-transform:uppercase;font-family:inherit}
.pill.active{background:#5C5557;border-color:#5C5557;color:#F9E8DF}
.week-select{padding:8px 14px;border:0.5px solid #e8d5cc;border-radius:20px;font-size:12px;color:#5C5557;background:#fff;font-family:inherit;letter-spacing:1px;cursor:pointer}
.week-select:focus{outline:none}
.section-title{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#9a8a87;margin-bottom:1rem}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:2rem}
.metric{background:#fff;border-radius:12px;padding:1.25rem;border:0.5px solid #e8d5cc}
.metric-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9a8a87;margin-bottom:8px}
.metric-value{font-size:26px;font-weight:400;color:#5C5557}
.metric-value.good{color:#0F6E56}
.metric-value.warn{color:#BA7517}
.metric-value.bad{color:#A32D2D}
.metric-target{font-size:10px;color:#c0b0ad;margin-top:4px;letter-spacing:1px}
.card{background:#fff;border-radius:12px;padding:1.5rem;border:0.5px solid #e8d5cc;margin-bottom:1.5rem}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:0.5px solid #e8d5cc}
.tab{padding:8px 20px;font-size:11px;cursor:pointer;border-bottom:2px solid transparent;color:#9a8a87;margin-bottom:-0.5px;letter-spacing:2px;text-transform:uppercase;font-family:inherit;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:#5C5557;border-bottom-color:#5C5557}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;color:#9a8a87;font-weight:400;border-bottom:0.5px solid #e8d5cc;white-space:nowrap;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-family:inherit}
td{padding:8px 10px;border-bottom:0.5px solid #f0e8e4;color:#5C5557}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px}
.badge.good{background:#E1F5EE;color:#0F6E56}
.badge.warn{background:#FAEEDA;color:#854F0B}
.badge.bad{background:#FCEBEB;color:#A32D2D}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{font-size:12px;color:#5C5557;min-width:90px}
.bar-track{flex:1;height:6px;background:#F9E8DF;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-val{font-size:12px;color:#9a8a87;min-width:36px;text-align:right}
.target-line{font-size:10px;color:#c0b0ad;margin-top:6px;letter-spacing:1px}
.empty{text-align:center;padding:4rem;color:#c0b0ad;font-size:14px;letter-spacing:1px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem}
@media(max-width:700px){.charts-grid{grid-template-columns:1fr}}
.loading{text-align:center;padding:4rem;color:#9a8a87;letter-spacing:2px;font-size:12px;text-transform:uppercase}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo-name">Tara Rose</div>
    <div class="logo-sub">Salon &nbsp;·&nbsp; Performance Dashboard</div>
  </div>
  <div class="header-right" id="lastUpdated"></div>
</header>

<main>
  <div class="controls">
    <div class="branch-pills" id="branchPills"></div>
    <select class="week-select" id="weekSelect" onchange="renderDashboard()">
      <option value="all">All weeks</option>
    </select>
  </div>

  <div id="dashContent"><div class="loading">Loading data...</div></div>
</main>

<script>
const SUPA_URL = 'https://gvijxenafoowajqktqvd.supabase.co';
const SUPA_KEY = 'sb_publishable_e5o0vPayb-6552oARTeu7Q_KoqfT7xO';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

const TARGETS = {hairAvgBill:650,beautyAvgBill:200,treatmentPct:20,retailPct:12,rebookPct:45};
const BRANCHES = {KCA:'Khalifa City',SAA:'Saadiyat',MC:'Motor City',AQ:'AQ Ladies'};

let allData = [];
let activeBranch = 'KCA';
let charts = {};

function sc(val, target) {
  const p = val/target;
  return p >= 0.95 ? 'good' : p >= 0.75 ? 'warn' : 'bad';
}
function fmtAED(n) { return 'AED ' + Math.round(n||0).toLocaleString(); }
function fmtPct(n) { return (+(n||0)).toFixed(1) + '%'; }

async function loadData() {
  const { data, error } = await sb.from('weekly_data').select('*').order('uploaded_at', { ascending: true });
  if (error || !data) { document.getElementById('dashContent').innerHTML = '<div class="empty">No data available yet.</div>'; return; }
  allData = data;
  buildControls();
  renderDashboard();
  if (data.length) {
    const latest = new Date(data[data.length-1].uploaded_at);
    document.getElementById('lastUpdated').textContent = 'Updated ' + latest.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }
}

function buildControls() {
  const branches = [...new Set(allData.map(d => d.branch))];
  const pills = document.getElementById('branchPills');
  pills.innerHTML = branches.map(b => `
    <div class="pill ${b===activeBranch?'active':''}" onclick="setBranch('${b}')">${BRANCHES[b]||b}</div>
  `).join('');

  const branchData = allData.filter(d => d.branch === activeBranch);
  const sel = document.getElementById('weekSelect');
  const current = sel.value;
  sel.innerHTML = '<option value="all">All weeks combined</option>' +
    branchData.map(d => `<option value="${d.id}">${d.week_label}</option>`).join('');
  if ([...sel.options].some(o => o.value === current)) sel.value = current;
}

function setBranch(b) {
  activeBranch = b;
  document.getElementById('weekSelect').value = 'all';
  buildControls();
  renderDashboard();
}

function getActiveData() {
  const wkId = document.getElementById('weekSelect').value;
  const branchData = allData.filter(d => d.branch === activeBranch);
  if (wkId === 'all') return branchData.map(d => d.data);
  const found = branchData.find(d => d.id === wkId);
  return found ? [found.data] : [];
}

function aggData(datasets) {
  if (!datasets.length) return null;
  const hairMap = {}, beautyMap = {};
  const summary = {totalClients:0,hairRetail:0,treatmentSales:0,colTake:0,beautySales:0,netTake:0,hairRetailPct:0,treatmentPct:0,beautyPct:0,colPct:0,avgBill:0};
  let totalRebooked=0, totalHairClients=0;

  datasets.forEach(d => {
    if (!d) return;
    const s = d.summary||{};
    summary.totalClients += s.totalClients||0;
    summary.hairRetail += s.hairRetail||0;
    summary.treatmentSales += s.treatmentSales||0;
    summary.colTake += s.colTake||0;
    summary.beautySales += s.beautySales||0;
    summary.netTake += s.netTake||0;
    if (s.totals) { totalRebooked += s.totals.rebooked||0; totalHairClients += s.totals.total||0; }

    (d.hairStaff||[]).forEach(st => {
      if (!hairMap[st.name]) hairMap[st.name] = {...st};
      else {
        const a = hairMap[st.name];
        a.total+=st.total; a.newC+=st.newC; a.rebooked+=st.rebooked;
        a.hairSalesNet+=st.hairSalesNet; a.retail+=st.retail; a.treatments+=st.treatments;
      }
    });
    (d.beautyStaff||[]).forEach(st => {
      if (!beautyMap[st.name]) beautyMap[st.name] = {...st};
      else { beautyMap[st.name].total+=st.total; beautyMap[st.name].beautySales+=st.beautySales; }
    });
  });

  summary.avgBill = summary.totalClients ? summary.netTake/summary.totalClients : 0;
  summary.treatmentPct = summary.netTake ? (summary.treatmentSales/summary.netTake*100) : 0;
  summary.hairRetailPct = summary.netTake ? (summary.hairRetail/summary.netTake*100) : 0;
  summary.rebookPct = totalHairClients ? (totalRebooked/totalHairClients*100) : 0;
  summary.beautyPct = summary.netTake ? (summary.beautySales/summary.netTake*100) : 0;

  const hairStaff = Object.values(hairMap).map(s => ({
    ...s,
    avgBill: s.total ? s.hairSalesNet/s.total : 0,
    rebookPct: s.total ? (s.rebooked/s.total*100) : 0
  }));
  const beautyStaff = Object.values(beautyMap).map(s => ({
    ...s,
    avgBill: s.total ? s.beautySales/s.total : 0
  }));

  return { summary, hairStaff, beautyStaff };
}

function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

function renderDashboard() {
  const datasets = getActiveData();
  if (!datasets.length) {
    document.getElementById('dashContent').innerHTML = '<div class="empty">No data for this selection.</div>';
    return;
  }
  const d = aggData(datasets);
  if (!d) return;
  const s = d.summary;

  destroyCharts();

  document.getElementById('dashContent').innerHTML = `
    <div class="section-title">${BRANCHES[activeBranch]||activeBranch} &nbsp;·&nbsp; Key metrics</div>
    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Net revenue</div>
        <div class="metric-value">${fmtAED(s.netTake)}</div>
        <div class="metric-target">Target: AED 660,000/mo</div>
      </div>
      <div class="metric">
        <div class="metric-label">Total clients</div>
        <div class="metric-value">${s.totalClients}</div>
        <div class="metric-target">Target: 943/mo</div>
      </div>
      <div class="metric">
        <div class="metric-label">Avg bill</div>
        <div class="metric-value ${sc(s.avgBill,TARGETS.hairAvgBill)}">${fmtAED(s.avgBill)}</div>
        <div class="metric-target">Target: AED ${TARGETS.hairAvgBill}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Treatment %</div>
        <div class="metric-value ${sc(s.treatmentPct,TARGETS.treatmentPct)}">${fmtPct(s.treatmentPct)}</div>
        <div class="metric-target">Target: ${TARGETS.treatmentPct}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">Retail %</div>
        <div class="metric-value ${sc(s.hairRetailPct,TARGETS.retailPct)}">${fmtPct(s.hairRetailPct)}</div>
        <div class="metric-target">Target: ${TARGETS.retailPct}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">Rebooking %</div>
        <div class="metric-value ${sc(s.rebookPct,TARGETS.rebookPct)}">${fmtPct(s.rebookPct)}</div>
        <div class="metric-target">Target: ${TARGETS.rebookPct}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">Beauty sales</div>
        <div class="metric-value">${fmtAED(s.beautySales)}</div>
        <div class="metric-target">${fmtPct(s.beautyPct)} of total</div>
      </div>
      <div class="metric">
        <div class="metric-label">Colour take</div>
        <div class="metric-value">${fmtAED(s.colTake)}</div>
        <div class="metric-target">${fmtPct(s.colPct||0)} of hair</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="card">
        <div class="section-title">Revenue mix</div>
        <div style="position:relative;height:220px"><canvas id="mixChart" role="img" aria-label="Revenue mix donut chart"></canvas></div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;color:#9a8a87">
          <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#5C5557;display:inline-block"></span>Hair + Tx</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#F9E8DF;border:1px solid #c0b0ad;display:inline-block"></span>Beauty</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#c0b0ad;display:inline-block"></span>Retail</span>
        </div>
      </div>
      <div class="card">
        <div class="section-title">Rebooking by stylist</div>
        ${d.hairStaff.sort((a,b)=>b.rebookPct-a.rebookPct).map(st=>`
        <div class="bar-row">
          <div class="bar-label">${st.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(st.rebookPct,100)}%;background:${st.rebookPct>=45?'#5C5557':st.rebookPct>=30?'#BA7517':'#A32D2D'}"></div></div>
          <div class="bar-val">${fmtPct(st.rebookPct)}</div>
        </div>`).join('')}
        <div class="target-line">Target: 45%</div>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab(this,'hair')">Hair stylists</button>
        <button class="tab" onclick="switchTab(this,'beauty')">Beauty team</button>
      </div>
      <div id="tab-hair">
        <table>
          <thead><tr>
            <th>Stylist</th><th>Clients</th><th>New</th><th>Rebook %</th>
            <th>Hair sales</th><th>Avg bill</th><th>Retail</th><th>Treatments</th>
          </tr></thead>
          <tbody>
            ${d.hairStaff.sort((a,b)=>b.hairSalesNet-a.hairSalesNet).map(st=>`
            <tr>
              <td>${st.name}</td>
              <td>${st.total}</td>
              <td>${st.newC}</td>
              <td><span class="badge ${sc(st.rebookPct,TARGETS.rebookPct)}">${fmtPct(st.rebookPct)}</span></td>
              <td>${fmtAED(st.hairSalesNet)}</td>
              <td><span class="badge ${sc(st.avgBill,TARGETS.hairAvgBill)}">${fmtAED(st.avgBill)}</span></td>
              <td>${fmtAED(st.retail)}</td>
              <td>${fmtAED(st.treatments)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div id="tab-beauty" style="display:none">
        <table>
          <thead><tr>
            <th>Therapist</th><th>Clients</th><th>Beauty sales</th><th>Avg bill</th><th>Rebook %</th>
          </tr></thead>
          <tbody>
            ${d.beautyStaff.sort((a,b)=>b.beautySales-a.beautySales).map(st=>`
            <tr>
              <td>${st.name}</td>
              <td>${st.total}</td>
              <td>${fmtAED(st.beautySales)}</td>
              <td><span class="badge ${sc(st.avgBill,TARGETS.beautyAvgBill)}">${fmtAED(st.avgBill)}</span></td>
              <td><span class="badge ${sc(st.rebookPct,30)}">${fmtPct(st.rebookPct)}</span></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const hairTx = s.netTake - s.beautySales - s.hairRetail;
  charts.mix = new Chart(document.getElementById('mixChart'), {
    type: 'doughnut',
    data: {
      labels: ['Hair + Tx', 'Beauty', 'Retail'],
      datasets: [{
        data: [Math.max(0,hairTx), s.beautySales, s.hairRetail],
        backgroundColor: ['#5C5557','#F9E8DF','#c0b0ad'],
        borderColor: ['#5C5557','#e8d5cc','#c0b0ad'],
        borderWidth: 1
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '65%',
      plugins: { legend: { display: false } }
    }
  });
}

function switchTab(el, tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-hair').style.display = tab==='hair' ? '' : 'none';
  document.getElementById('tab-beauty').style.display = tab==='beauty' ? '' : 'none';
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
