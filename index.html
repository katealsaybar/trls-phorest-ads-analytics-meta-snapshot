<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Top Services — Tara Rose Ladies Salon</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --gold:       #C9A96E;
  --gold-lt:    #E8D5B0;
  --gold-dk:    #9A7A44;
  --dark:       #151515;
  --surface:    #1E1E1E;
  --surface2:   #252525;
  --mid:        #2E2E2E;
  --border:     rgba(201,169,110,0.18);
  --text:       #F0EDE8;
  --muted:      #808080;
  --muted2:     #555;
  --green:      #6BAF8D;
  --accent:     #C9A96E;

  /* Chart palette */
  --c1: #C9A96E;
  --c2: #8FA8C8;
  --c3: #C88FA8;
  --c4: #8FC8A8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── HEADER ───────────────────────────────────── */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand { display: flex; align-items: center; gap: 14px; }

.brand-text .eyebrow {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 2px;
}

.brand-text h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 22px;
  color: var(--text);
  letter-spacing: 0.02em;
}

.brand-logo {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  color: var(--gold);
}

/* ─── FILTERS ──────────────────────────────────── */
.filters-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 18px 40px;
  display: flex;
  align-items: flex-start;
  gap: 32px;
  flex-wrap: wrap;
}

.filter-group label {
  display: block;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

.branch-checks {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.branch-check {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  transition: color 0.15s;
  user-select: none;
}

.branch-check input { display: none; }

.branch-check .pill {
  padding: 5px 13px;
  border-radius: 20px;
  border: 1px solid var(--muted2);
  font-size: 12px;
  transition: all 0.15s;
  color: var(--muted);
  font-weight: 400;
}

.branch-check input:checked + .pill {
  border-color: var(--gold);
  background: rgba(201,169,110,0.12);
  color: var(--gold-lt);
  font-weight: 500;
}

.filter-selects { display: flex; gap: 14px; }

select {
  background: var(--mid);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 7px 12px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s;
}

select:focus { border-color: var(--gold); }

.report-toggle {
  display: flex;
  background: var(--mid);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.report-toggle button {
  padding: 7px 18px;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}

.report-toggle button.active {
  background: var(--gold);
  color: var(--dark);
  font-weight: 500;
}

/* ─── MAIN ─────────────────────────────────────── */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 36px 40px 60px;
}

/* ─── LOADING / EMPTY ──────────────────────────── */
.state-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 60px;
  text-align: center;
}

.state-card .icon { font-size: 36px; margin-bottom: 16px; }

.state-card h3 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 22px;
  color: var(--gold-lt);
  margin-bottom: 8px;
}

.state-card p { font-size: 13px; color: var(--muted); line-height: 1.6; }

.spinner {
  width: 32px;
  height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── KPI BLOCKS ───────────────────────────────── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 22px;
  position: relative;
  overflow: hidden;
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--gold), transparent);
}

.kpi-card .kpi-label {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

.kpi-card .kpi-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-weight: 400;
  color: var(--text);
  line-height: 1;
  margin-bottom: 4px;
}

.kpi-card .kpi-sub {
  font-size: 11.5px;
  color: var(--muted);
}

/* ─── INSIGHT TEXT ─────────────────────────────── */
.insight-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 32px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.insight-block .insight-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }

.insight-block .insight-text h4 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 500;
  font-size: 17px;
  color: var(--gold-lt);
  margin-bottom: 6px;
}

.insight-block .insight-text p {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.7;
}

.insight-block .insight-text p strong { color: var(--text); font-weight: 500; }

/* ─── CHARTS GRID ──────────────────────────────── */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}

@media (max-width: 768px) {
  .charts-grid { grid-template-columns: 1fr; }
  .filters-bar { padding: 16px 20px; }
  main { padding: 24px 20px 60px; }
  .site-header { padding: 16px 20px; }
}

.chart-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
}

.chart-card.wide {
  grid-column: 1 / -1;
}

.chart-card h3 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 18px;
  color: var(--gold-lt);
  margin-bottom: 4px;
}

.chart-card .chart-sub {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 20px;
}

.chart-wrap { position: relative; height: 260px; }

/* ─── TABLE ────────────────────────────────────── */
.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 32px;
}

.table-card .table-head {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
}

.table-card .table-head h3 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 18px;
  color: var(--gold-lt);
}

.table-card .table-head p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead th {
  padding: 10px 16px;
  text-align: left;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold);
  background: var(--surface2);
  font-weight: 400;
}

tbody tr {
  border-top: 1px solid rgba(255,255,255,0.04);
  transition: background 0.12s;
}

tbody tr:hover { background: rgba(201,169,110,0.04); }

td {
  padding: 11px 16px;
  font-size: 13px;
  color: var(--text);
}

td.rank {
  color: var(--gold);
  font-weight: 500;
  width: 40px;
}

td.num { text-align: right; font-variant-numeric: tabular-nums; }

td.muted { color: var(--muted); }

.branch-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  background: rgba(201,169,110,0.12);
  color: var(--gold);
  border: 1px solid rgba(201,169,110,0.2);
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="brand">
    <div class="brand-logo">TR</div>
    <div class="brand-text">
      <div class="eyebrow">Performance Report</div>
      <h1>Top Services Dashboard</h1>
    </div>
  </div>
</header>

<!-- FILTERS -->
<div class="filters-bar">
  <div class="filter-group">
    <label>Branch</label>
    <div class="branch-checks">
      <label class="branch-check">
        <input type="checkbox" name="branch" value="KCA" checked>
        <span class="pill">KCA</span>
      </label>
      <label class="branch-check">
        <input type="checkbox" name="branch" value="SAA" checked>
        <span class="pill">SAA</span>
      </label>
      <label class="branch-check">
        <input type="checkbox" name="branch" value="MC" checked>
        <span class="pill">MC</span>
      </label>
      <label class="branch-check">
        <input type="checkbox" name="branch" value="AQ" checked>
        <span class="pill">AQ</span>
      </label>
    </div>
  </div>

  <div class="filter-group">
    <label>Period</label>
    <div class="filter-selects">
      <select id="sel-month">
        <option value="0">All Months</option>
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>
      <select id="sel-year"></select>
    </div>
  </div>

  <div class="filter-group">
    <label>Report Type</label>
    <div class="report-toggle">
      <button id="btn-revenue" class="active" onclick="setReport('Revenue')">Revenue</button>
      <button id="btn-profit" onclick="setReport('Profit')">Profit</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<main id="main">
  <div class="state-card" id="loading-state">
    <div class="spinner"></div>
    <h3>Loading data…</h3>
    <p>Fetching from Supabase</p>
  </div>
</main>

<script>
// ── CONFIG ───────────────────────────────────────
const SUPABASE_URL = 'https://syzxjlmhnssddeymzvwc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_36v7iJofatGlPFDj04R65Q_953Wvuqw';
const TABLE = 'top_services';

const BRANCH_NAMES = { KCA: 'Khalifa City A', SAA: 'Mamsha Al Saadiyat', MC: 'Motor City', AQ: 'Al Quoz' };
const MONTHS = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
const BRANCH_COLORS = { KCA: '#C9A96E', SAA: '#8FA8C8', MC: '#C88FA8', AQ: '#8FC8A8' };

// ── STATE ────────────────────────────────────────
let allData = [];
let reportType = 'Revenue';
let charts = {};

// ── INIT ─────────────────────────────────────────
async function init() {
  await loadData();
  populateYears();
  attachListeners();
  render();
}

async function loadData() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=rank.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allData = await res.json();
  } catch (err) {
    document.getElementById('main').innerHTML = `
      <div class="state-card">
        <div class="icon">⚠️</div>
        <h3>Could not load data</h3>
        <p>${err.message}</p>
      </div>`;
  }
}

function populateYears() {
  const years = [...new Set(allData.map(r => r.year))].sort((a,b) => b - a);
  const sel = document.getElementById('sel-year');
  sel.innerHTML = '<option value="0">All Years</option>';
  years.forEach(y => sel.innerHTML += `<option value="${y}">${y}</option>`);
  if (years.length) sel.value = years[0];
}

// ── FILTERS ──────────────────────────────────────
function getFilters() {
  const branches = [...document.querySelectorAll('input[name=branch]:checked')].map(el => el.value);
  const month    = parseInt(document.getElementById('sel-month').value);
  const year     = parseInt(document.getElementById('sel-year').value);
  return { branches, month, year };
}

function filtered() {
  const { branches, month, year } = getFilters();
  return allData.filter(r =>
    r.report_type === reportType &&
    branches.includes(r.branch) &&
    (month === 0 || r.month === month) &&
    (year  === 0 || r.year  === year)
  );
}

function setReport(type) {
  reportType = type;
  document.getElementById('btn-revenue').classList.toggle('active', type === 'Revenue');
  document.getElementById('btn-profit').classList.toggle('active', type === 'Profit');
  render();
}

function attachListeners() {
  document.querySelectorAll('input[name=branch]').forEach(el => el.addEventListener('change', render));
  document.getElementById('sel-month').addEventListener('change', render);
  document.getElementById('sel-year').addEventListener('change', render);
}

// ── RENDER ────────────────────────────────────────
function render() {
  const data = filtered();
  const main = document.getElementById('main');

  if (!data.length) {
    destroyCharts();
    main.innerHTML = `
      <div class="state-card">
        <div class="icon">🔍</div>
        <h3>No data found</h3>
        <p>Try adjusting your filters, or upload data for the selected period via the upload page.</p>
      </div>`;
    return;
  }

  const { branches, month, year } = getFilters();
  const metric = reportType === 'Revenue' ? 'revenue' : 'profit';
  const metricLabel = reportType;

  // Aggregate by description across selected branches
  const serviceMap = {};
  data.forEach(r => {
    const key = r.description || r.category;
    if (!serviceMap[key]) serviceMap[key] = { description: key, category: r.category, totalMetric: 0, totalQty: 0, byBranch: {} };
    serviceMap[key].totalMetric += parseFloat(r[metric] || 0);
    serviceMap[key].totalQty   += parseInt(r.qty || 0);
    serviceMap[key].byBranch[r.branch] = (serviceMap[key].byBranch[r.branch] || 0) + parseFloat(r[metric] || 0);
  });

  const services = Object.values(serviceMap).sort((a,b) => b.totalMetric - a.totalMetric).slice(0, 10);
  const top = services[0];

  // KPIs
  const totalMetric = data.reduce((s,r) => s + parseFloat(r[metric] || 0), 0);
  const totalQty    = data.reduce((s,r) => s + parseInt(r.qty || 0), 0);
  const uniqueCats  = [...new Set(data.map(r => r.category))].length;

  // Period label
  const periodLabel = `${month === 0 ? 'All Months' : MONTHS[month]}${year !== 0 ? ' ' + year : ''}`;

  // Build HTML
  destroyCharts();
  main.innerHTML = `
    <!-- KPIs -->
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">Total ${metricLabel}</div>
        <div class="kpi-value">${fmtAED(totalMetric)}</div>
        <div class="kpi-sub">${periodLabel} · ${branches.length} branch${branches.length > 1 ? 'es' : ''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Bookings</div>
        <div class="kpi-value">${fmtNum(totalQty)}</div>
        <div class="kpi-sub">across all selected services</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Top Service</div>
        <div class="kpi-value" style="font-size:18px;line-height:1.2">${top ? top.description : '—'}</div>
        <div class="kpi-sub">${top ? fmtAED(top.totalMetric) + ' ' + metricLabel.toLowerCase() : ''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Categories</div>
        <div class="kpi-value">${uniqueCats}</div>
        <div class="kpi-sub">service categories</div>
      </div>
    </div>

    <!-- INSIGHT -->
    <div class="insight-block" id="insight-block">
      <div class="insight-icon">✦</div>
      <div class="insight-text">
        <h4>Performance Snapshot</h4>
        <p id="insight-text">—</p>
      </div>
    </div>

    <!-- CHARTS -->
    <div class="charts-grid">
      <div class="chart-card wide">
        <h3>Top 10 Services by ${metricLabel}</h3>
        <div class="chart-sub">AED · ${periodLabel}</div>
        <div class="chart-wrap"><canvas id="chart-bar"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>${metricLabel} by Category</h3>
        <div class="chart-sub">Distribution across service categories</div>
        <div class="chart-wrap"><canvas id="chart-donut"></canvas></div>
      </div>
      ${branches.length > 1 ? `
      <div class="chart-card">
        <h3>Branch Comparison</h3>
        <div class="chart-sub">Top 5 services · ${metricLabel} split by branch</div>
        <div class="chart-wrap"><canvas id="chart-branch"></canvas></div>
      </div>` : ''}
    </div>

    <!-- TABLE -->
    <div class="table-card">
      <div class="table-head">
        <h3>Top Services — Detail</h3>
        <p>Ranked by ${metricLabel.toLowerCase()} · ${periodLabel}</p>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Service</th>
              <th>Category</th>
              <th style="text-align:right">Qty</th>
              <th style="text-align:right">${metricLabel} (AED)</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  `;

  // Insight text
  const topCat = Object.entries(
    data.reduce((acc, r) => { acc[r.category] = (acc[r.category]||0) + parseFloat(r[metric]||0); return acc; }, {})
  ).sort((a,b) => b[1]-a[1])[0];

  const avgPerBooking = totalQty > 0 ? totalMetric / totalQty : 0;
  document.getElementById('insight-text').innerHTML =
    `The highest-earning service is <strong>${top?.description || '—'}</strong> contributing <strong>${fmtAED(top?.totalMetric || 0)}</strong> in ${metricLabel.toLowerCase()}.
    The top-performing category is <strong>${topCat?.[0] || '—'}</strong> with <strong>${fmtAED(topCat?.[1] || 0)}</strong>.
    Average ${metricLabel.toLowerCase()} per booking across all selected services is <strong>AED ${fmtNum(Math.round(avgPerBooking))}</strong>.`;

  // Table rows
  const tbody = document.getElementById('table-body');
  services.forEach((s, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank">${i + 1}</td>
      <td>${s.description}</td>
      <td class="muted">${s.category}</td>
      <td class="num">${fmtNum(s.totalQty)}</td>
      <td class="num">${fmtAED(s.totalMetric)}</td>
    `;
    tbody.appendChild(tr);
  });

  // Charts
  buildBarChart(services, metricLabel);
  buildDonutChart(data, metric);
  if (branches.length > 1) buildBranchChart(services.slice(0, 5), branches, metric, metricLabel);
}

// ── CHARTS ────────────────────────────────────────
const chartDefaults = {
  color: '#808080',
  font: { family: 'DM Sans', size: 12 }
};

function buildBarChart(services, metricLabel) {
  const ctx = document.getElementById('chart-bar');
  if (!ctx) return;
  charts.bar = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: services.map(s => truncate(s.description, 24)),
      datasets: [{
        label: metricLabel,
        data: services.map(s => s.totalMetric),
        backgroundColor: services.map((_, i) => i === 0 ? '#C9A96E' : 'rgba(201,169,110,0.3)'),
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => 'AED ' + fmtNum(Math.round(ctx.raw)) } }
      },
      scales: {
        x: { ticks: { color: '#808080', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { ticks: { color: '#808080', callback: v => 'AED ' + fmtNum(v) }, grid: { color: 'rgba(255,255,255,0.04)' } }
      }
    }
  });
}

function buildDonutChart(data, metric) {
  const ctx = document.getElementById('chart-donut');
  if (!ctx) return;
  const catMap = {};
  data.forEach(r => { catMap[r.category] = (catMap[r.category]||0) + parseFloat(r[metric]||0); });
  const entries = Object.entries(catMap).sort((a,b) => b[1]-a[1]);
  const palette = ['#C9A96E','#8FA8C8','#C88FA8','#8FC8A8','#C8B88F','#A88FC8','#8FC8C8','#C8A88F'];
  charts.donut = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: entries.map(e => e[0]),
      datasets: [{ data: entries.map(e => e[1]), backgroundColor: palette, borderWidth: 0, hoverOffset: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '65%',
      plugins: {
        legend: { position: 'bottom', labels: { color: '#808080', font: { size: 11 }, padding: 12 } },
        tooltip: { callbacks: { label: ctx => ctx.label + ': AED ' + fmtNum(Math.round(ctx.raw)) } }
      }
    }
  });
}

function buildBranchChart(services, branches, metric, metricLabel) {
  const ctx = document.getElementById('chart-branch');
  if (!ctx) return;
  const palette = Object.values(BRANCH_COLORS);
  charts.branch = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: services.map(s => truncate(s.description, 18)),
      datasets: branches.map((b, i) => ({
        label: b,
        data: services.map(s => s.byBranch[b] || 0),
        backgroundColor: palette[i] || '#888',
        borderRadius: 3,
        borderSkipped: false,
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#808080', font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': AED ' + fmtNum(Math.round(ctx.raw)) } }
      },
      scales: {
        x: { stacked: true, ticks: { color: '#808080', font: { size: 10 } }, grid: { display: false } },
        y: { stacked: true, ticks: { color: '#808080', callback: v => 'AED ' + fmtNum(v) }, grid: { color: 'rgba(255,255,255,0.04)' } }
      }
    }
  });
}

function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

// ── UTILS ─────────────────────────────────────────
function fmtAED(v) { return 'AED ' + fmtNum(Math.round(v)); }
function fmtNum(v) { return Number(v).toLocaleString('en-AE'); }
function truncate(str, n) { return str && str.length > n ? str.slice(0, n) + '…' : str; }

init();
</script>
