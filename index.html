<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Services – Tara Rose Ladies Salon</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --cream: #FAF7F2;
    --blush: #C9A99A;
    --rose: #8B4A4A;
    --dark: #2C1F1F;
    --mid: #6B5050;
    --light: #E8DDD5;
    --border: #D9CEC8;
    --white: #FFFFFF;
    --chart1: #8B4A4A;
    --chart2: #C9A99A;
    --chart3: #B07070;
    --chart4: #D4B8B0;
    --chart5: #6B5050;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
  }

  /* HEADER */
  header {
  background: var(--dark);
  padding: 28px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 101;
}

  .header-left h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.9rem;
    font-weight: 300;
    color: var(--cream);
    letter-spacing: 0.06em;
  }

  .header-left p {
    font-size: 0.75rem;
    color: var(--blush);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* FILTERS */
  .filters {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 20px 48px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: flex-end;
  position: sticky;
  top: 85px;
  z-index: 100;
}

  .filter-group { display: flex; flex-direction: column; gap: 6px; }

  .filter-group label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mid);
  }

  select, .branch-checks {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    color: var(--dark);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    background: var(--cream);
    cursor: pointer;
    outline: none;
  }

  select:focus { border-color: var(--blush); }

  .branch-checks {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 6px 0;
    border: none;
    background: none;
  }

  .branch-check {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 500;
    transition: all 0.15s;
    user-select: none;
    background: var(--cream);
  }

  .branch-check input { display: none; }

  .branch-check.checked {
    background: var(--rose);
    border-color: var(--rose);
    color: var(--white);
  }

  .btn-apply {
    padding: 8px 20px;
    background: var(--rose);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    align-self: flex-end;
  }

  .btn-apply:hover { background: var(--dark); }

  /* MAIN */
  main {
    padding: 40px 48px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* STAT BLOCKS */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }

  .stat-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 20px;
  }

  .stat-card .stat-label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 8px;
  }

  .stat-card .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 400;
    color: var(--rose);
    line-height: 1;
  }

  .stat-card .stat-sub {
    font-size: 0.75rem;
    color: var(--blush);
    margin-top: 4px;
  }

  /* CHARTS GRID */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 32px;
  }

  @media (max-width: 900px) {
    .charts-grid { grid-template-columns: 1fr; }
    main { padding: 24px 20px; }
    header { padding: 20px; }
    .filters { padding: 16px 20px; }
  }

  .chart-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
  }

  .chart-card.full { grid-column: 1 / -1; }

  .chart-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--rose);
    margin-bottom: 4px;
  }

  .chart-card .chart-desc {
    font-size: 0.78rem;
    color: var(--mid);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .chart-wrapper {
    position: relative;
    height: 300px;
  }

  .chart-wrapper.tall { height: 380px; }

  /* TABLE */
  .table-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    margin-bottom: 24px;
    overflow-x: auto;
  }

  .table-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--rose);
    margin-bottom: 4px;
  }

  .table-card .chart-desc {
    font-size: 0.78rem;
    color: var(--mid);
    margin-bottom: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  th {
    text-align: left;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mid);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--cream);
    color: var(--dark);
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--cream); }

  .rank-badge {
    display: inline-block;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--rose);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 500;
    text-align: center;
    line-height: 22px;
  }

  .rank-badge.gold { background: #C9A849; }
  .rank-badge.silver { background: #9E9E9E; }
  .rank-badge.bronze { background: #A0674A; }

  .cat-pill {
    display: inline-block;
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--light);
    color: var(--mid);
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .branch-pill {
    display: inline-block;
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--rose);
    color: #fff;
    font-weight: 500;
  }

  .empty-state {
    text-align: center;
    padding: 60px;
    color: var(--blush);
    font-style: italic;
    font-size: 0.9rem;
  }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--blush);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    letter-spacing: 0.05em;
  }

  .insight-box {
    background: linear-gradient(135deg, #FDF5F0, #FAF7F2);
    border: 1px solid var(--blush);
    border-left: 4px solid var(--rose);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 24px;
    font-size: 0.85rem;
    line-height: 1.7;
    color: var(--dark);
  }

  .insight-box strong {
    color: var(--rose);
    font-weight: 500;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Tara Rose Ladies Salon</h1>
    <p>Top Services Performance Report</p>
  </div>
</header>

<div class="filters">
  <div class="filter-group">
    <label>Branch</label>
    <div class="branch-checks" id="branchChecks">
      <label class="branch-check checked"><input type="checkbox" value="KCA" checked> KCA</label>
      <label class="branch-check checked"><input type="checkbox" value="SAA" checked> SAA</label>
      <label class="branch-check checked"><input type="checkbox" value="MC" checked> MC</label>
      <label class="branch-check checked"><input type="checkbox" value="AQ" checked> AQ</label>
    </div>
  </div>
  
  <div class="filter-group">
    <label>Report Type</label>
    <select id="reportType">
      <option value="revenue">Revenue</option>
      <option value="profit">Profit</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Month</label>
    <select id="filterMonth">
      <option value="">All Months</option>
      <option value="1">January</option>
      <option value="2">February</option>
      <option value="3">March</option>
      <option value="4">April</option>
      <option value="5">May</option>
      <option value="6">June</option>
      <option value="7">July</option>
      <option value="8">August</option>
      <option value="9">September</option>
      <option value="10">October</option>
      <option value="11">November</option>
      <option value="12">December</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Year</label>
    <select id="filterYear">
      <option value="2025">2025</option>
      <option value="2026">2026</option>
    </select>
  </div>

  <button class="btn-apply" onclick="applyFilters()">Apply</button>
</div>

<main>
  <div id="dashboard">
    <div class="loading">Loading data...</div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://syzxjlmhnssddeymzvwc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_36v7iJofatGlPFDj04R65Q_953Wvuqw';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const BRANCH_FULL = { KCA: 'Khalifa City A', SAA: 'Mamsha Al Saadiyat', MC: 'Motor City', AQ: 'Al Quoz' };
const PALETTE = ['#8B4A4A','#C9A99A','#B07070','#D4B8B0','#6B5050','#E8DDD5','#2C1F1F','#A07878'];

let chartInstances = {};

// Branch checkbox toggle
document.getElementById('branchChecks').addEventListener('click', e => {
  const label = e.target.closest('.branch-check');
  if (!label) return;
  const cb = label.querySelector('input');
  cb.checked = !cb.checked;
  label.classList.toggle('checked', cb.checked);
});

function getSelectedBranches() {
  return Array.from(document.querySelectorAll('.branch-check input:checked')).map(c => c.value);
}

function aed(n) {
  if (!n && n !== 0) return '—';
  return 'AED ' + Number(n).toLocaleString('en-AE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function num(n) {
  if (!n && n !== 0) return '—';
  return Number(n).toLocaleString();
}

async function fetchData(branches, reportType, month, year) {
  let url = `${SUPABASE_URL}/rest/v1/top_services?report_type=eq.${reportType}&year=eq.${year}&order=revenue.desc`;
  if (branches.length > 0) url += `&branch=in.(${branches.join(',')})`;
  if (month) url += `&month=eq.${month}`;

  const res = await fetch(url, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  return res.json();
}

function destroyChart(id) {
  if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
}

function renderChart(id, config) {
  destroyChart(id);
  const ctx = document.getElementById(id).getContext('2d');
  chartInstances[id] = new Chart(ctx, config);
}

function buildInsight(data, reportType, branches, month, year) {
  if (!data.length) return '';
  const field = reportType === 'revenue' ? 'revenue' : 'profit';
  const total = data.reduce((s, r) => s + (r[field] || 0), 0);
  const topService = [...data].sort((a, b) => (b[field] || 0) - (a[field] || 0))[0];
  const topCat = {};
  data.forEach(r => { topCat[r.category] = (topCat[r.category] || 0) + (r[field] || 0); });
  const bestCat = Object.entries(topCat).sort((a, b) => b[1] - a[1])[0];
  const period = month ? `${MONTHS[month - 1]} ${year}` : `${year}`;
  const branchText = branches.length === 4 ? 'all branches' : branches.map(b => BRANCH_FULL[b] || b).join(', ');

  return `
    <div class="insight-box">
      For <strong>${period}</strong> across <strong>${branchText}</strong>: 
      Total ${reportType} stands at <strong>${aed(total)}</strong>. 
      The top-performing service is <strong>${topService.description}</strong> (${topService.category}), 
      generating <strong>${aed(topService[field])}</strong>. 
      The strongest service category overall is <strong>${bestCat[0]}</strong> with <strong>${aed(bestCat[1])}</strong> in ${reportType}.
    </div>
  `;
}

async function applyFilters() {
  const branches = getSelectedBranches();
  const reportType = document.getElementById('reportType').value;
  const month = document.getElementById('filterMonth').value;
  const year = document.getElementById('filterYear').value;
  const dashboard = document.getElementById('dashboard');

  if (!branches.length) {
    dashboard.innerHTML = '<div class="empty-state">Please select at least one branch.</div>';
    return;
  }

  dashboard.innerHTML = '<div class="loading">Fetching data...</div>';
  Object.keys(chartInstances).forEach(id => destroyChart(id));

  try {
    const data = await fetchData(branches, reportType, month, year);

    if (!data.length) {
      dashboard.innerHTML = '<div class="empty-state">No data found for the selected filters. Try uploading data first via upload.html.</div>';
      return;
    }

    const field = reportType === 'revenue' ? 'revenue' : 'profit';

    // Aggregate by description across branches
    const byService = {};
    data.forEach(r => {
      const key = r.description;
      if (!byService[key]) byService[key] = { description: r.description, category: r.category, revenue: 0, profit: 0, qty: 0, time_hrs: 0 };
      byService[key].revenue += r.revenue || 0;
      byService[key].profit += r.profit || 0;
      byService[key].qty += r.qty || 0;
      byService[key].time_hrs += r.time_hrs || 0;
    });

    const services = Object.values(byService).sort((a, b) => b[field] - a[field]).slice(0, 10);

    // By category
    const byCat = {};
    data.forEach(r => {
      if (!byCat[r.category]) byCat[r.category] = 0;
      byCat[r.category] += r[field] || 0;
    });
    const catEntries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

    // By branch
    const byBranch = {};
    data.forEach(r => {
      if (!byBranch[r.branch]) byBranch[r.branch] = 0;
      byBranch[r.branch] += r[field] || 0;
    });

    // Stats
    const totalVal = services.reduce((s, r) => s + (r[field] || 0), 0);
    const totalQty = services.reduce((s, r) => s + (r.qty || 0), 0);
    const totalHrs = services.reduce((s, r) => s + (r.time_hrs || 0), 0);
    const avgPerService = services.length ? totalVal / services.length : 0;

    dashboard.innerHTML = `
      ${buildInsight(data, reportType, branches, month, year)}

      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Total ${reportType}</div>
          <div class="stat-value">${aed(totalVal)}</div>
          <div class="stat-sub">Across selected filters</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Bookings</div>
          <div class="stat-value">${num(totalQty)}</div>
          <div class="stat-sub">Services rendered</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Hours</div>
          <div class="stat-value">${Number(totalHrs).toFixed(0)}</div>
          <div class="stat-sub">Time rendered</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg per Service</div>
          <div class="stat-value">${aed(avgPerService)}</div>
          <div class="stat-sub">Average ${reportType}</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3>Top Services by ${reportType.charAt(0).toUpperCase() + reportType.slice(1)}</h3>
          <p class="chart-desc">Horizontal bar chart showing the top 10 services ranked by ${reportType}.</p>
          <div class="chart-wrapper tall">
            <canvas id="chartBar"></canvas>
          </div>
        </div>

        <div class="chart-card">
          <h3>Revenue by Category</h3>
          <p class="chart-desc">Share of ${reportType} by service category — shows which category drives the most income.</p>
          <div class="chart-wrapper">
            <canvas id="chartDoughnut"></canvas>
          </div>
        </div>

        ${branches.length > 1 ? `
        <div class="chart-card full">
          <h3>Branch Comparison</h3>
          <p class="chart-desc">Total ${reportType} per branch for the selected period.</p>
          <div class="chart-wrapper">
            <canvas id="chartBranch"></canvas>
          </div>
        </div>` : ''}
      </div>

      <div class="table-card">
        <h3>Top Services Detail</h3>
        <p class="chart-desc">Full breakdown of top performing services including bookings, time, and ${reportType}.</p>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Service</th>
              <th>Category</th>
              <th>Qty</th>
              <th>Time (hrs)</th>
              <th>${reportType.charAt(0).toUpperCase() + reportType.slice(1)} (AED)</th>
            </tr>
          </thead>
          <tbody>
            ${services.map((s, i) => `<tr>
              <td><span class="rank-badge ${i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : ''}">${i + 1}</span></td>
              <td>${s.description}</td>
              <td><span class="cat-pill">${s.category}</span></td>
              <td>${num(s.qty)}</td>
              <td>${Number(s.time_hrs).toFixed(1)}</td>
              <td><strong>${aed(s[field])}</strong></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;

    // Bar chart
    renderChart('chartBar', {
      type: 'bar',
      data: {
        labels: services.map(s => s.description.length > 28 ? s.description.slice(0, 28) + '…' : s.description),
        datasets: [{
          label: reportType.charAt(0).toUpperCase() + reportType.slice(1) + ' (AED)',
          data: services.map(s => s[field]),
          backgroundColor: PALETTE[0],
          borderRadius: 4,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { callback: v => 'AED ' + (v >= 1000 ? (v/1000).toFixed(0) + 'k' : v), font: { size: 11 } }, grid: { color: '#E8DDD5' } },
          y: { ticks: { font: { size: 11 } }, grid: { display: false } }
        }
      }
    });

    // Doughnut
    renderChart('chartDoughnut', {
      type: 'doughnut',
      data: {
        labels: catEntries.map(([k]) => k),
        datasets: [{ data: catEntries.map(([, v]) => v), backgroundColor: PALETTE, borderWidth: 2, borderColor: '#fff' }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { font: { size: 11 }, padding: 12 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: AED ${Number(ctx.raw).toLocaleString('en-AE', {maximumFractionDigits:0})}` } }
        }
      }
    });

    // Branch comparison
    if (branches.length > 1 && document.getElementById('chartBranch')) {
      const branchLabels = Object.keys(byBranch).map(b => BRANCH_FULL[b] || b);
      renderChart('chartBranch', {
        type: 'bar',
        data: {
          labels: branchLabels,
          datasets: [{
            label: reportType.charAt(0).toUpperCase() + reportType.slice(1) + ' (AED)',
            data: Object.values(byBranch),
            backgroundColor: PALETTE,
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { ticks: { callback: v => 'AED ' + (v >= 1000 ? (v/1000).toFixed(0) + 'k' : v), font: { size: 11 } }, grid: { color: '#E8DDD5' } },
            x: { ticks: { font: { size: 11 } }, grid: { display: false } }
          }
        }
      });
    }

  } catch(e) {
    dashboard.innerHTML = `<div class="empty-state">Error loading data: ${e.message}</div>`;
  }
}

applyFilters();
</script>
</body>
</html>
